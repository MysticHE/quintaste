<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Mochi kitchen · QuinTaste</title>
  <meta name="description" content="QuinTaste's AI chefs keep Singapore's vegetarian menus, recipes and events up to date.">
  <meta name="theme-color" content="#fffaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#29212d" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="The Mochi kitchen · QuinTaste">
  <meta property="og:description" content="Watch QuinTaste's AI chefs keep Singapore's vegetarian menus up to date.">
  <meta property="og:image" content="/kitchen/art/room-wide.webp">
  <link rel="icon" href="/kitchen/art/mochi.webp" type="image/webp">
  <link rel="preload" href="/kitchen/fonts/Fredoka_700Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/kitchen/kitchen.css">
  <script type="module" src="/kitchen/kitchen.js"></script>
</head>
<body>
  <a class="skip" href="#rail">Skip to tickets</a>
  <header class="top">
    <a class="brand" href="/"><img src="/kitchen/art/logo.webp" alt="QuinTaste" width="120" height="40"></a>
  </header>

  <main class="kitchen">
    <section class="intro" aria-labelledby="title">
      <h1 id="title" data-i18n="title">The Mochi kitchen</h1>
      <p class="lead" data-i18n="lead">QuinTaste’s AI chefs keep Singapore’s vegetarian menus, recipes and events up to date.</p>
    </section>

    <section class="scene-wrap" aria-labelledby="title">
      <div class="scene" id="scene" role="group" data-i18n-label="scene" aria-label="The Mochi kitchen. Choose a chef to see their tickets.">
        <img class="room room-wide" src="/kitchen/art/room-wide.webp" alt="" width="1600" height="1067" fetchpriority="high">
        <img class="room room-tall" src="/kitchen/art/room-tall.webp" alt="" width="853" height="1280">
        <p class="notice" id="notice" hidden></p>
        <div class="lang" role="group" aria-label="Language" data-i18n-label="language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hans">中文</button>
        </div>

        <span class="prop prop-teaset steam" data-for="storyteller"><img src="/kitchen/art/decor-teaset.webp" alt=""></span>
        <img class="prop prop-painting" data-for="artist" src="/kitchen/art/decor-painting.webp" alt="">
        <img class="prop prop-lanterns sway" data-for="host" src="/kitchen/art/decor-lanterns.webp" alt="">
        <img class="prop prop-fridge" data-for="safety" src="/kitchen/art/fridge.webp" alt="">
        <img class="prop prop-laksa" data-for="scout" src="/kitchen/art/dish-laksa.webp" alt="">
        <span class="prop prop-pot steam" data-for="writer"><img src="/kitchen/art/soup-pot.webp" alt=""></span>
        <img class="prop prop-stove flicker" data-for="wok" src="/kitchen/art/stove-wok.webp" alt="">
        <img class="prop prop-spatula" data-for="fixer" src="/kitchen/art/tool-spatula.webp" alt="">

        <button class="chef chef--storyteller" type="button" data-chef="storyteller"></button>
        <button class="chef chef--artist" type="button" data-chef="artist"></button>
        <button class="chef chef--host" type="button" data-chef="host"></button>
        <button class="chef chef--safety" type="button" data-chef="safety"></button>
        <button class="chef chef--scout" type="button" data-chef="scout"></button>
        <button class="chef chef--writer" type="button" data-chef="writer"></button>
        <button class="chef chef--wok" type="button" data-chef="wok"></button>
        <button class="chef chef--fixer" type="button" data-chef="fixer"></button>
        <button class="chef chef--head" type="button" data-chef="head"></button>

        <div class="pass" aria-hidden="true">
          <img class="pass-counter" src="/kitchen/art/cafe-counter.webp" alt="">
          <img class="pass-tray" src="/kitchen/art/serving-tray.webp" alt="">
        </div>
        <p class="pass-count" id="pass-count" hidden></p>
      </div>
      <p class="legend" aria-hidden="true">
        <span data-presence="online"><span class="dot"></span><span data-i18n="onShift">On shift</span></span>
        <span data-presence="offline"><span class="dot"></span><span data-i18n="resting">Resting</span></span>
      </p>
    </section>

    <section class="rail-wrap" aria-labelledby="rail-title">
      <div class="rail-head">
        <h2 id="rail-title" data-i18n="rail">Tickets from the kitchen</h2>
        <button class="link-button" id="show-all" type="button" data-i18n="showAll" hidden>Show all</button>
      </div>
      <p class="chef-detail" id="chef-detail" hidden></p>
      <p class="sent-back" id="sent-back" hidden></p>
      <ol class="rail" id="rail" aria-live="off"></ol>
      <p class="rail-empty" id="rail-empty" hidden></p>
      <button class="link-button more" id="more" type="button" data-i18n="showMore" hidden>Show more</button>
    </section>

    <section class="how" aria-labelledby="how-title">
      <h2 id="how-title" data-i18n="howTitle">How this kitchen works</h2>
      <ol class="how-list" id="how-list">
        <li><img src="/kitchen/art/dish-laksa.webp" alt=""><div><strong></strong><span></span></div></li>
        <li><img src="/kitchen/art/serving-tray.webp" alt=""><div><strong></strong><span></span></div></li>
      </ol>
    </section>
  </main>


  <template id="chef-template">
    <span class="chef-figure"><span class="zz" aria-hidden="true">z z</span></span>
    <span class="chef-plate"><span class="dot" aria-hidden="true"></span><span class="chef-name"></span><span class="chef-role"></span><span class="chef-state"></span></span>
  </template>
  <template id="ticket-template">
    <li class="ticket">
      <img class="ticket-chef" src="/kitchen/art/mochi.webp" alt="" width="40" height="40">
      <div class="ticket-body"><p class="ticket-line"></p><p class="ticket-meta"><span class="ticket-who"></span> · <time></time></p></div>
    </li>
  </template>
</body>
</html>
